# The load-aware policy as qualified in the prplMesh lab: a shorter load hold
# and a tighter report skew than the RDK lab's load-aware-policy.yaml.
policy_version: 1
load_aware_enabled: true
current_rcpi_below: 120
minimum_target_gain_rcpi: 16
condition_hold_seconds: 5
minimum_dwell_seconds: 20
steer_timeout_seconds: 40
post_steer_cooldown_seconds: 15
# expected_devices: the lab's, not the policy's (the room counts its inventory; the live
# CLI takes --expected-devices)
expected_clients: 20
load_high_utilization: 192
load_maximum_target_utilization: 128
load_minimum_advantage: 64
load_minimum_target_rcpi: 120
load_maximum_signal_loss_rcpi: 8
load_condition_hold_seconds: 5
load_settle_seconds: 15
load_maximum_age_seconds: 5
load_maximum_report_skew_seconds: 1
load_minimum_activity_packets_per_second: 10
