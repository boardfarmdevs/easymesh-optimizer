# The optimizer's, the room service's and the acceptance tools' checks, without a lab: their
# tests, with the medium next to them as in the labs (optimizer/ and medium/ side by side).
# The site and the documentation check: pages.yml.
name: checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # easymesh-medium at the commit the labs pin
  MEDIUM_REF: 7ebd325d0e88543fc4051a3f873b39a96c8c8eff

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          path: optimizer
      - uses: actions/checkout@v5
        with:
          repository: boardfarmdevs/easymesh-medium
          ref: ${{ env.MEDIUM_REF }}
          path: medium
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pytest
      - name: Tests (the optimizer, the room service and the acceptance tools, both stacks)
        working-directory: optimizer
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: The acceptance tools' JavaScript tests
        working-directory: optimizer/acceptance
        run: for test in test-*.js; do echo "== $test"; node "$test"; done
