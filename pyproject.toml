[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easymesh-optimizer"
version = "0.1.0"
description = "External observation, replay and steering-policy harness for the EasyMesh lab"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
em-optimizer = "optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["optimizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
